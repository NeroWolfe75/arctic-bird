<!doctype html><html lang="ru" style="color-scheme:dark"><head><meta charset="utf-8"><title>Arctic Bird 0.3.8 — внутренние страницы</title><style>/* Arctic Bird 0.3.8
 * ================================================================
 *                     НАСТРОЙКА ОФОРМЛЕНИЯ
 * ================================================================
 * light-dark(СВЕТЛАЯ, ТЁМНАЯ): меняйте одну или обе половины пары.
 * Например: --f11-accent: light-dark(#0f6cbd, #8bc7ff);
 * Сохраните файл и полностью перезапустите Thunderbird.
 * CSS-файлы сохраняйте как обычный UTF-8, без расширения .txt.
 *
 * Это общие токены для оболочки и адаптеров бесед. Thunderbird не
 * наследует CSS-переменные между документами: поэтому settings.css
 * импортируется и из userChrome.css, и из userContent.css.
 */
:root {
  /* Режим: light dark = автоматически; dark = тёмный; light = светлый.
   * Принудительный режим относится к областям, оформленным этим скином. */
  --f11-color-scheme: dark;

  /* 1. ОСНОВНЫЕ ПОВЕРХНОСТИ */
  --f11-shell: light-dark(#f3f4f6, #101217);       /* верхняя и нижняя панели */
  --f11-paper: light-dark(#ffffff, #0d0e11);       /* список и чтение */
  --f11-raised: light-dark(#fafbfc, #1b1d24);      /* меню и карточки */
  --f11-field: light-dark(#ffffff, #191c23);       /* поиск и ввод */
  --f11-hover: light-dark(#e9edf2, #242935);       /* наведение */
  --f11-pressed: light-dark(#dfe5ec, #2b3543);     /* нажатие */
  --f11-line: light-dark(#e2e6ec, #292e38);        /* разделители */
  --f11-control-line: light-dark(#818a98, #545c6b); /* границы ввода */

  /* Палитра тёмной схемы — Brackets Refined — Arctic для Zed.
   * Боковая панель и почта имеют единый фон, как на скриншоте. */
  --f11-sidebar: light-dark(#f3f4f6, #0d0e11);
  --f11-tabs-background: light-dark(#f3f4f6, #101217);
  --f11-tab-active: var(--f11-paper);
  --f11-tab-radius: 8px;
  /* Общая строка вкладок и поиска. Ниже 1100 CSS px поиск переходит вниз. */
  --f11-header-height: 36px;
  --f11-header-tools-width: clamp(240px, 28vw, 420px);

  /* 2. ТЕКСТ И АКЦЕНТ */
  --f11-text: light-dark(#1b1b1b, #e6e8ef);
  --f11-secondary: light-dark(#565f6c, #a3a9bb);
  --f11-accent: light-dark(#0f6cbd, #8bc7ff);
  --f11-on-accent: light-dark(#ffffff, #0d0e11);
  --f11-selection: light-dark(#e3eefb, #303f50);
  --f11-selection-idle: light-dark(#e8ecf2, #242935);

  /* 3. ГЕОМЕТРИЯ — высоту строк списка здесь не меняем.
   * Используйте штатное меню «Вид → Плотность». */
  --f11-font: "Segoe UI Variable Text", "Segoe UI", sans-serif;
  --f11-radius: 6px;             /* кнопки, вкладки, строки */
  --f11-card-radius: 8px;        /* карточки бесед и меню */
  --f11-folder-inline: 6px;      /* боковые поля дерева папок */
  --f11-reader-padding: 16px;
  --f11-subject-size: 1.3rem;

  /* 4. ШТАТНЫЙ СПИСОК СООБЩЕНИЙ
   * 0px + transparent = плоские строки (по умолчанию).
   * Для карточек: radius 8px, border var(--f11-line).
   * Это форма строк; режим «Карточки / Таблица» выбирается в Thunderbird. */
  --f11-list-radius: 0px;
  --f11-list-border: transparent;

  /* Можно использовать системный акцент Windows. Раскомментируйте
   * ВСЕ ТРИ строки. При произвольном системном цвете контраст проверьте.
  --f11-accent: AccentColor;
  --f11-on-accent: AccentColorText;
  --f11-selection: color-mix(in srgb, AccentColor 15%, var(--f11-paper));
   */
}

енным этим скином. */\n  --f11-color-scheme: dark;\n\n  /* 1. ОСНОВНЫЕ ПОВЕРХНОСТИ */\n  --f11-shell: light-dark(#f3f4f6, #101217);       /* верхняя и нижняя панели */\n  --f11-paper: light-dark(#ffffff, #0d0e11);       /* список и чтение */\n  --f11-raised: light-dark(#fafbfc, #1b1d24);      /* меню и карточки */\n  --f11-field: light-dark(#ffffff, #191c23);       /* поиск и ввод */\n  --f11-hover: light-dark(#e9edf2, #242935);       /* наведение */\n  --f11-pressed: light-dark(#dfe5ec, #2b3543);     /* нажатие */\n  --f11-line: light-dark(#e2e6ec, #292e38);        /* разделители */\n  --f11-control-line: light-dark(#818a98, #545c6b); /* границы ввода */\n\n  /* Палитра тёмной схемы — Brackets Refined — Arctic для Zed.\n   * Боковая панель и почта имеют единый фон, как на скриншоте. */\n  --f11-sidebar: light-dark(#f3f4f6, #0d0e11);\n  --f11-tabs-background: light-dark(#f3f4f6, #101217);\n  --f11-tab-active: var(--f11-paper);\n  --f11-tab-radius: 8px;\n  /* Общая строка вкладок и поиска. Ниже 1100 CSS px поиск переходит вниз. */\n  --f11-header-height: 36px;\n  --f11-header-tools-width: clamp(240px, 28vw, 420px);\n\n  /* 2. ТЕКСТ И АКЦЕНТ */\n  --f11-text: light-dark(#1b1b1b, #e6e8ef);\n  --f11-secondary: light-dark(#565f6c, #a3a9bb);\n  --f11-accent: light-dark(#0f6cbd, #8bc7ff);\n  --f11-on-accent: light-dark(#ffffff, #0d0e11);\n  --f11-selection: light-dark(#e3eefb, #303f50);\n  --f11-selection-idle: light-dark(#e8ecf2, #242935);\n\n  /* 3. ГЕОМЕТРИЯ — высоту строк списка здесь не меняем.\n   * Используйте штатное меню «Вид → Плотность». */\n  --f11-font: \"Segoe UI Variable Text\", \"Segoe UI\", sans-serif;\n  --f11-radius: 6px;             /* кнопки, вкладки, строки */\n  --f11-card-radius: 8px;        /* карточки бесед и меню */\n  --f11-folder-inline: 6px;      /* боковые поля дерева папок */\n  --f11-reader-padding: 16px;\n  --f11-subject-size: 1.3rem;\n\n  /* 4. ШТАТНЫЙ СПИСОК СООБЩЕНИЙ\n   * 0px + transparent = плоские строки (по умолчанию).\n   * Для кар -color: var(--f11-line) !important; }\n    /* Навигация мини-календаря использует жёстко заданный серый hover,\n     * а разделение месяца и года — цвет текста вместо цвета границы. */\n    calendar-minimonth .minimonth-nav-item { border-color: var(--f11-line) !important; }\n    calendar-minimonth :is(.minimonth-header button, .minimonth-header-btn):not(:disabled, [disabled]):hover {\n      background-color: var(--f11-hover) !important;\n      border-color: var(--f11-line) !important;\n    }\n    calendar-minimonth :is(.minimonth-header button, .minimonth-header-btn):not(:disabled, [disabled]):hover:active {\n      background-color: var(--f11-pressed) !important;\n    }\n    /* У деревьев XUL базовый выбранный фон яркий акцентный и рассчитан\n     * на --selected-item-text-color. Сохраняем этот контрастный механизм,\n     * включая особые цвета просроченных и выполняемых задач. */\n    /* Эти HTML-поля живут в главном chrome-документе и имеют\n     * собственную яркую рамку из searchBox.css. */\n    #unifinder-search-field, #task-text-filter-field,\n    #view-task-edit-field, #unifinder-task-edit-field,\n    #event-filter-menulist {\n      border-color: var(--f11-line) !important;\n      background-color: var(--f11-field) !important;\n      color: var(--f11-text) !important;\n      box-shadow: none !important;\n    }\n    #unifinder-search-field:hover, #task-text-filter-field:hover,\n    #view-task-edit-field:hover, #unifinder-task-edit-field:hover {\n      border-color: var(--f11-line) !important;\n      box-shadow: none !important;\n    }\n    #unifinder-search-field:focus-visible, #task-text-filter-field:focus-visible,\n    #view-task-edit-field:focus-visible, #unifinder-task-edit-field:focus-visible {\n      outline: 1px solid var(--f11-accent) !important;\n      outline-offset: 1px !important;\n    }\n  }\n\n*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.5 \"Segoe UI\",Arial,sans-serif}body{background:var(--f11-paper);color:var(--f11-text)}. );\n  --f11-tabs-background: light-dark(#f3f4f6, #101217);\n  --f11-tab-active: var(--f11-paper);\n  --f11-tab-radius: 8px;\n  /* Общая строка вкладок и поиска. Ниже 1100 CSS px поиск переходит вниз. */\n  --f11-header-height: 36px;\n  --f11-header-tools-width: clamp(240px, 28vw, 420px);\n\n  /* 2. ТЕКСТ И АКЦЕНТ */\n  --f11-text: light-dark(#1b1b1b, #e6e8ef);\n  --f11-secondary: light-dark(#565f6c, #a3a9bb);\n  --f11-accent: light-dark(#0f6cbd, #8bc7ff);\n  --f11-on-accent: light-dark(#ffffff, #0d0e11);\n  --f11-selection: light-dark(#e3eefb, #303f50);\n  --f11-selection-idle: light-dark(#e8ecf2, #242935);\n\n  /* 3. ГЕОМЕТРИЯ — высоту строк списка здесь не меняем.\n   * Используйте штатное меню «Вид → Плотность». */\n  --f11-font: \"Segoe UI Variable Text\", \"Segoe UI\", sans-serif;\n  --f11-radius: 6px;             /* кнопки, вкладки, строки */\n  --f11-card-radius: 8px;        /* карточки бесед и меню */\n  --f11-folder-inline: 6px;      /* боковые поля дерева папок */\n  --f11-reader-padding: 16px;\n  --f11-subject-size: 1.3rem;\n\n  /* 4. ШТАТНЫЙ СПИСОК СООБЩЕНИЙ\n   * 0px + transparent = плоские строки (по умолчанию).\n   * Для карточек: radius 8px, border var(--f11-line).\n   * Это форма строк; режим «Карточки / Таблица» выбирается в Thunderbird. */\n  --f11-list-radius: 0px;\n  --f11-list-border: transparent;\n\n  /* Можно использовать системный акцент Windows. Раскомментируйте\n   * ВСЕ ТРИ строки. При произвольном системном цвете контраст проверьте.\n  --f11-accent: AccentColor;\n  --f11-on-accent: AccentColorText;\n  --f11-selection: color-mix(in srgb, AccentColor 15%, var(--f11-paper));\n   */\n}\n\n\n  @media screen and (forced-colors: none) and (prefers-contrast: no-preference) {\n    :root {\n      color-scheme: var(--f11-color-scheme) !important;\n      font-family: var(--f11-font) !important;\n      --layout-background-0: var(--f11-paper) !important;\n      --layout-background-1: var(--f11-shell) !important;\n      --layout-background-2: var(--f11
